---
post:
  description: Duplicates a tracker
  parameters:
    - name: trackerId
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: The name of the new duplicated tracker
            dupCateg:
              type: integer
              description: The category of the new duplicated tracker
            dupPerms:
              type: integer
              description: The permanent name of the new duplicated tracker
  responses:
    '200':
      description: tracker duplicate response
      content:
        application/json:
          schema:
            type: object
            properties:
              trackerId:
                type: integer
              name:
                type: string
              message:
                type: string
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
    '404':
      description: not found
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml