---
get:
  description: Export tracker fields
  parameters:
    - name: trackerId
      in: path
      required: true
      schema:
        type: integer
    - name: fields[]
      in: query
      description: The array of field IDs to export. The field IDs must be integers. eg. fields[]=1&fields[]=2
      required: false
      schema:
        type: array  
        items:
          type: integer
  responses:
    '200':
      description: tracker fields export
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              trackerId:
                type: integer
              fields:
                type: array
                items:
                  $ref: schemas-TrackerField.yaml
              export:
                type: string
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
    '404':
      description: not found
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml