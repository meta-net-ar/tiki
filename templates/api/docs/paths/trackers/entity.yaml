---
get:
  description: Retrieve items in a tracker.
  parameters:
    - name: trackerId
      in: path
      description: Tracker ID
      required: true
      schema:
        type: integer
    - name: offset
      in: query
      description: Start offset for the number of records to return.
      schema:
        type: integer
    - name: maxRecords
      in: query
      description: Maximum number of records to return.
      schema:
        type: integer
    - name: modifiedSince
      in: query
      description: Return only records newer than the specified timestamp.
      schema:
        type: integer
    - name: status
      in: query
      description: |
        Return only records with specific status. Possible values are:
        - `o`: Open - The item is currently active and open.
        - `p`: Pending - The item is pending and awaiting further action.
        - `c`: Closed - The item is closed and no longer active
      schema:
        type: string
    - name: format
      in: query
      description: Specify 'raw' to return raw item values without any field processing.
      schema:
        type: string
  responses:
    '200':
      description: tracker items response
      content:
        application/json:
          schema:
            type: object
            properties:
              trackerId:
                type: integer
              offset:
                type: integer
              maxRecords:
                type: integer
              result:
                type: array
                items:
                  type: object
                  properties:
                    itemId:
                      type: integer
                    status:
                      type: string
                    fields:
                      type: object
                      example: |
                        {"field1PermName": "value", "field2PermName": "value"}
              count:
                type: integer
                description: Total number of items matching the query (before offset/maxRecords).
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
post:
  description: Update a tracker.
  parameters:
    - name: trackerId
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: schemas-Tracker.yaml
  responses:
    '200':
      description: Updated tracker configuration view (same shape as create).
      content:
        application/json:
          schema:
            $ref: schemas-TrackerCreateUpdateResponse.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
delete:
  description: Remove a tracker.
  parameters:
    - name: trackerId
      in: path
      required: true
      schema:
        type: integer
  responses:
    '200':
      description: Deletion confirmation.
      content:
        application/json:
          schema:
            type: object
            properties:
              trackerId:
                type: integer
              name:
                type: string
                nullable: true
              message:
                type: string
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml