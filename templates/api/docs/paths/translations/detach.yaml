---
post:
  description: Detach translations
  parameters:
    - name: type
      in: path
      required: true
      description: |
        The Tiki object type. Possible values are:
        - `wiki page`, `forum`, `tracker`, `file gallery`, etc
      schema:
        type: string
    - name: source
      in: path
      required: true
      description: |
        The source object name. For example, if the type is `wiki page`, the source is the wiki page name.
      schema:
        type: string
    - name: target
      in: query
      required: true
      description: |
        The target object name. For example, if the type is `wiki page`, the target is the wiki page name.
      schema:
        type: string
  responses:
    '200':
      description: detach translation response
      content:
        application/json:
          schema:
            type: object
            properties:
              FORWARD:
                type: object
                properties:
                  controller:
                    type: string
                  action:
                    type: string
                  type:
                    type: string
                  source:
                    type: string
    '400':
      description: bad request
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml