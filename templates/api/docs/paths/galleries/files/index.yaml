---
get:
  description: |
    Retrieve all files of a gallery.

    The extracted-content fields (`metadata`, `search_data`, `ocr_data`) are omitted
    unless `metadata=1` is passed. They have no size limit and typically dominate the
    response.
  parameters:
    - name: galleryId
      in: path
      description: Gallery ID to retrieve files from
      required: true
      schema:
        type: integer
    - name: offset
      in: query
      description: Start offset for the number of records to return.
      schema:
        type: integer
    - name: maxRecords
      in: query
      description: Maximum number of records to return.
      schema:
        type: integer
    - name: sort_mode
      in: query
      description: |
        The sort mode. Possible values are:
        - `created_desc`, `created_asc`, `name_desc`, `name_asc`
      schema:
        type: string
    - name: user
      in: query
      description: The gallery creator.
      schema:
        type: string
    - name: find
      in: query
      description: The search string to find files.
      schema:
        type: string
    - name: metadata
      in: query
      description: Set to 1 to include the extracted-content fields in each file entry.
      schema:
        type: integer
        enum: [0, 1]
        default: 0
  responses:
    '200':
      description: files response
      content:
        application/json:
          schema:
            $ref: schemas-FileListResponse.yaml
    '403':
      description: forbidden
      content:
        application/json:
          schema:
            $ref: schemas-Error.yaml
